<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>翻页时钟 · 上海黄浦天气</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:Helvetica,Arial,sans-serif;transition:background .3s}
.theme0{background:#FFCC99}
.theme1{background:#222}
.theme1 .digit{background:#333}
.theme1 .num{color:#eee}
.theme1 .colon{color:#eee}
.theme1 .digit::before{background:#444}
.theme2{background:#f5f5f5}
.theme2 .digit{background:#111}
.theme2 .num{color:#fff} 
.theme2 .colon{color:#111}
.theme3{background:#192841}
.theme3 .digit{background:#fff}
.theme3 .num{color:#192841}
.theme3 .colon{color:#fff}
.clock{display:flex;align-items:center;gap:16px}
.digit-group{display:flex;gap:10px}
.digit{width:130px;height:200px;background:#fff;border-radius:10px;margin:0 4px;position:relative;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:background .3s}
.digit::before{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#eee;z-index:2;transition:background .3s}
.num{width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:140px;color:#333;transition:transform .3s ease,color .3s}
.colon{font-size:150px;color:#333;margin:0 8px;display:inline-block;transition:color .3s}

/* 底部双按钮容器 */
.button-group {
    position: fixed;
    bottom: 30px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 20px;
    z-index: 30;
}

/* 按钮基础样式（移除独立fixed，共用风格） */
.btn {
    padding: 10px 22px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 500;
    backdrop-filter: blur(2px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.btn:active {
    opacity: 0.8;
    transform: scale(0.96);
}

/* 天气卡片 - 整体放大5px基准尺寸 (内边距、字体、圆角、间距都基于5px增量) */
.weather-card {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 25;
    background: rgba(0, 0, 0, 0.7);
    border-radius: 37px;
    padding: 17px 25px;
    font-family: Helvetica, Arial, sans-serif;
    transition: all 0.2s ease;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    min-width: 265px;
    text-align: right;
}

.theme0 .weather-card {
    background: rgba(245, 215, 170, 0.85);
    border-color: rgba(100, 70, 30, 0.25);
    color: #4a2c10;
}
.theme1 .weather-card {
    background: rgba(35, 35, 45, 0.85);
    border-color: rgba(255,255,255,0.2);
    color: #f0f0f0;
}
.theme2 .weather-card {
    background: rgba(235, 235, 240, 0.85);
    border-color: rgba(0,0,0,0.1);
    color: #1e1e2a;
}
.theme3 .weather-card {
    background: rgba(20, 35, 55, 0.85);
    border-color: rgba(255,255,255,0.2);
    color: #eef4ff;
}

.weather-now {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 23px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}
.weather-icon-temp {
    display: flex;
    align-items: baseline;
    gap: 11px;
}
.weather-icon {
    font-size: 43px;
    line-height: 1;
}
.temp-unit {
    font-size: 37px;
    font-weight: 600;
    letter-spacing: -0.5px;
}
.weather-meta {
    display: flex;
    gap: 21px;
    font-size: 19px;
    background: rgba(255,255,255,0.2);
    padding: 10px 19px;
    border-radius: 45px;
    font-weight: 500;
}
.weather-meta span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.forecast-group {
    display: flex;
    gap: 21px;
    justify-content: flex-end;
    margin-top: 10px;
    flex-wrap: wrap;
}
.forecast-day-card {
    text-align: center;
    min-width: 78px;
    background: rgba(255,255,255,0.15);
    border-radius: 33px;
    padding: 11px 13px;
    transition: all 0.2s;
}
.forecast-week {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
}
.forecast-emoji {
    font-size: 29px;
    margin: 7px 0 5px;
}
.forecast-range {
    font-size: 17px;
    font-weight: 500;
    opacity: 0.9;
}

/* ========== GIF 素材区域 ========== */
.gif-container {
    position: fixed;
    top: 18px;
    left: 15px;
    width: 20%;
    max-width: 360px;
    min-width: 180px;
    z-index: 20;
    pointer-events: none;
    opacity: 0.85;
    transition: opacity 0.3s ease, display 0.2s;
}

.gif-container img {
    width: 87%;
    height: auto;
    display: block;
}

/* ========== 主题适配：针对黑色线条素材进行滤色 ========== */
.theme0 .gif-container img {
    filter: brightness(0.95) contrast(1.1);
}
.theme1 .gif-container img,
.theme3 .gif-container img,
.theme4 .gif-container img {
    filter: invert(1) brightness(1.2);
}
.theme2 .gif-container img {
    filter: brightness(0.9) contrast(1.2);
}

/* ========== 主题配色针对按钮的特殊风格（匹配各主题） ========== */
.theme0 .btn {
    background: #8B5A2B;
    color: #FFF4E0;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
}
.theme1 .btn {
    background: #555;
    color: #f0f0f0;
    border: 1px solid #777;
}
.theme2 .btn {
    background: #2c2c2c;
    color: #fff;
}
.theme3 .btn {
    background: #D9E2F0;
    color: #192841;
    border: 1px solid rgba(25,40,65,0.3);
}
.theme4 .btn {
    background: #2C2C3A;
    color: #FFE1A0;
    border: 1px solid rgba(255,230,160,0.3);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.theme4 .btn:active {
    background: #3d3d50;
}

/* ========== iPad 横屏 (1024x768) 专门优化 ========== */
@media (max-width: 1024px) {
    .weather-card { top: 16px; right: 16px; padding: 14px 20px; min-width: 235px; border-radius: 32px; }
    .weather-icon { font-size: 60px; }
    .temp-unit { font-size: 60px; }
    .weather-meta { gap: 25px; font-size: 30px; padding: 8px 16px; border-radius: 40px; }
    .forecast-group { gap: 10px; }
    .forecast-day-card { min-width: 70px; padding: 8px 10px; border-radius: 30px; }
    .forecast-week { font-size: 18px; }
    .forecast-emoji { font-size: 28px; }
    .forecast-range { font-size: 23px; }
    .weather-now { gap: 20px; margin-bottom: 5px; }
    
    .clock {
        gap: 5px;
    }
    .digit-group {
        gap: 6px;
    }
    .digit {
        width: 132px;
        height: 200px;
        margin: 0 1px;
        border-radius: 12px;
    }
    .num {
        font-size: 144px;
        font-weight: 600;
    }
    .colon {
        font-size: 140px;
        margin: 0 5px;
    }
    .gif-container {
        width: 25%;
        max-width: 300px;
        min-width: 150px;
    }
    .button-group {
        bottom: 25px;
        gap: 18px;
    }
    .btn {
        padding: 9px 20px;
        font-size: 15px;
    }
}

@media (max-width: 780px) {
    .weather-card { top: 12px; right: 12px; padding: 12px 16px; min-width: 210px; border-radius: 28px; }
    .weather-icon { font-size: 32px; }
    .temp-unit { font-size: 28px; }
    .weather-meta { gap: 14px; font-size: 13px; padding: 6px 14px; border-radius: 35px; }
    .forecast-group { gap: 14px; margin-top: 10px; }
    .forecast-day-card { min-width: 62px; padding: 6px 8px; border-radius: 26px; }
    .forecast-week { font-size: 13px; }
    .forecast-emoji { font-size: 22px; margin: 5px 0 3px; }
    .forecast-range { font-size: 12px; }
    .weather-now { gap: 16px; margin-bottom: 10px; }
    
    .clock {
        gap: 8px;
    }
    .digit-group {
        gap: 4px;
    }
    .digit {
        width: 102px;
        height: 158px;
        margin: 0 1px;
    }
    .num {
        font-size: 108px;
    }
    .colon {
        font-size: 108px;
        margin: 0 3px;
    }
    .gif-container {
        width: 35%;
        max-width: 220px;
        min-width: 120px;
    }
    .button-group {
        bottom: 20px;
        gap: 15px;
    }
    .btn {
        padding: 8px 18px;
        font-size: 14px;
    }
}

@media (max-width: 640px) {
    .weather-card { display: none; }
    .gif-container {
        width: 40%;
        max-width: 180px;
    }
    .button-group {
        bottom: 18px;
        gap: 14px;
    }
    .btn {
        padding: 7px 16px;
        font-size: 13px;
    }
}

/* ========== 近视眼友好配色 (theme4) 完整适配 ========== */
.theme4 {
    background: #1A1A24;
}
.theme4 .digit {
    background: #262632;
    box-shadow: 0 5px 12px rgba(0,0,0,0.35);
}
.theme4 .num {
    color: #FFDF9E;
    font-weight: 600;
    text-shadow: 0 0 1px rgba(0,0,0,0.2);
}
.theme4 .colon {
    color: #FFDF9E;
    text-shadow: 0 0 2px rgba(0,0,0,0.3);
}
.theme4 .digit::before {
    background: #3C3C4C;
}
.theme4 .weather-card {
    background: rgba(20, 20, 30, 0.92);
    border-color: rgba(255, 225, 160, 0.35);
    color: #FCF3DC;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
.theme4 .weather-meta {
    background: rgba(0, 0, 0, 0.45);
    color: #FFEFC8;
}
.theme4 .forecast-day-card {
    background: rgba(255, 235, 185, 0.12);
    backdrop-filter: blur(1px);
    color: #FCEABB;
}
.theme4 .forecast-week,
.theme4 .forecast-range {
    color: #FFEFCF;
}
.theme4 .weather-icon,
.theme4 .temp-unit {
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.3));
}
.theme4 .weather-meta span,
.theme4 .forecast-day-card div {
    font-weight: 500;
    letter-spacing: 0.3px;
}
</style></head>
<body class="theme0">
<div class="gif-container" id="gifContainer">
    <img src="./human.gif" alt="human animation" onerror="this.style.opacity='0.3'">
</div>

<div class="clock">
    <div class="digit-group"><div class="digit"><div class="num" id="h1">0</div></div><div class="digit"><div class="num" id="h2">0</div></div></div>
    <span class="colon">:</span>
    <div class="digit-group"><div class="digit"><div class="num" id="m1">0</div></div><div class="digit"><div class="num" id="m2">0</div></div></div>
    <span class="colon">:</span>
    <div class="digit-group"><div class="digit"><div class="num" id="s1">0</div></div><div class="digit"><div class="num" id="s2">0</div></div></div>
</div>

<!-- 双按钮容器：切换配色 + 隐藏/显示GIF -->
<div class="button-group">
    <button class="btn" id="themeBtn">切换配色</button>
    <button class="btn" id="toggleGifBtn">隐藏 GIF</button>
</div>

<div class="weather-card" id="weatherCard">
    <div class="weather-now">
        <div class="weather-icon-temp">
            <span class="weather-icon" id="weatherIcon">☀️</span>
            <span class="temp-unit" id="weatherTemp">--°</span>
        </div>
        <div class="weather-meta">
            <span id="weatherHumidity">💧 --%</span>
            <span id="weatherAqi">🌱 优</span>
        </div>
    </div>
    <div class="forecast-group" id="forecastGroup">
        <div class="forecast-day-card">加载中...</div>
    </div>
</div>

<script>
    // ========== 1. 翻页时钟逻辑 ==========
    var themes=["theme0","theme1","theme2","theme3","theme4"];
    var cur=0;
    var themeBtn=document.getElementById("themeBtn");
    themeBtn.onclick=function(){
        cur=(cur+1)%themes.length;
        document.body.className=themes[cur];
    };
    
    function pad(n){
        return n<10?"0"+n:""+n;
    }
    
    function flip(el,newVal){
        if(el.textContent===newVal) return;
        el.style.transform="rotateX(-90deg)";
        setTimeout(function(){
            el.textContent=newVal;
            el.style.transform="rotateX(0deg)";
        },150);
    }
    
    function updateClock() {
        var d=new Date();
        var h=pad(d.getHours()), m=pad(d.getMinutes()), s=pad(d.getSeconds());
        flip(document.getElementById("h1"),h[0]);
        flip(document.getElementById("h2"),h[1]);
        flip(document.getElementById("m1"),m[0]);
        flip(document.getElementById("m2"),m[1]);
        flip(document.getElementById("s1"),s[0]);
        flip(document.getElementById("s2"),s[1]);
    }
    
    updateClock();
    var clockInterval = setInterval(updateClock, 1000);
    
    // 每小时强制同步（避免任何偏移）
    setInterval(function() {
        var now = new Date();
        var hh = pad(now.getHours());
        var mm = pad(now.getMinutes());
        var ss = pad(now.getSeconds());
        var h1El = document.getElementById("h1");
        var h2El = document.getElementById("h2");
        var m1El = document.getElementById("m1");
        var m2El = document.getElementById("m2");
        var s1El = document.getElementById("s1");
        var s2El = document.getElementById("s2");
        if (h1El.textContent !== hh[0]) h1El.textContent = hh[0];
        if (h2El.textContent !== hh[1]) h2El.textContent = hh[1];
        if (m1El.textContent !== mm[0]) m1El.textContent = mm[0];
        if (m2El.textContent !== mm[1]) m2El.textContent = mm[1];
        if (s1El.textContent !== ss[0]) s1El.textContent = ss[0];
        if (s2El.textContent !== ss[1]) s2El.textContent = ss[1];
        var allNums = [h1El, h2El, m1El, m2El, s1El, s2El];
        for(var i=0;i<allNums.length;i++){
            var el=allNums[i];
            if(el.style.transform === "rotateX(-90deg)") el.style.transform = "rotateX(0deg)";
        }
    }, 3600000);
    
    // ========== 2. GIF 显示/隐藏 功能 + localStorage记忆 ==========
    var gifContainer = document.getElementById("gifContainer");
    var toggleGifBtn = document.getElementById("toggleGifBtn");
    
    // 读取存储状态 (是否隐藏)
    function getGifHiddenState() {
        try {
            var stored = localStorage.getItem("gifHidden");
            if (stored === "true") return true;
            if (stored === "false") return false;
            return false; // 默认显示
        } catch(e) {
            return false;
        }
    }
    
    function setGifHiddenState(isHidden) {
        try {
            localStorage.setItem("gifHidden", isHidden ? "true" : "false");
        } catch(e) {}
    }
    
    function applyGifVisibility(isHidden) {
        if (!gifContainer) return;
        if (isHidden) {
            gifContainer.style.display = "none";
            toggleGifBtn.textContent = "显示 GIF";
        } else {
            gifContainer.style.display = "";
            toggleGifBtn.textContent = "隐藏 GIF";
        }
    }
    
    function toggleGif() {
        var currentlyHidden = (gifContainer.style.display === "none");
        var newHiddenState = !currentlyHidden;
        applyGifVisibility(newHiddenState);
        setGifHiddenState(newHiddenState);
    }
    
    // 初始化GIF显示状态 (基于localStorage)
    var initialHidden = getGifHiddenState();
    applyGifVisibility(initialHidden);
    
    // 绑定toggle按钮事件
    if (toggleGifBtn) {
        toggleGifBtn.onclick = function(e) {
            e.preventDefault();
            toggleGif();
        };
    }
    
    // ========== 3. 天气模块 (上海市黄浦区 丽园路附近精确坐标: 31.2127, 121.4767) ==========
    var weatherIconEl = document.getElementById("weatherIcon");
    var weatherTempEl = document.getElementById("weatherTemp");
    var weatherHumidityEl = document.getElementById("weatherHumidity");
    var weatherAqiEl = document.getElementById("weatherAqi");
    var forecastGroup = document.getElementById("forecastGroup");
    
    // 精确坐标：黄浦区丽园路与蒙自路交叉口附近 (丽园路)
    var LAT = 31.2127;
    var LON = 121.4767;
    
    function wmoToEmoji(code) {
        var map = {
            0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 48: "🌫️",
            51: "🌦️", 53: "🌧️", 55: "🌧️", 56: "🌧️", 57: "🌧️",
            61: "🌧️", 63: "🌧️", 65: "🌧️", 66: "🌧️", 67: "🌧️",
            71: "❄️", 73: "❄️", 75: "❄️", 77: "❄️", 80: "🌦️",
            81: "🌧️", 82: "🌧️", 85: "🌨️", 86: "❄️", 95: "⛈️",
            96: "⛈️", 99: "⛈️"
        };
        return map[code] || "🌡️";
    }
    
    function getAqiInfo(aqi) {
        if (aqi <= 50) return { icon: "🌱", text: "优" };
        if (aqi <= 100) return { icon: "😊", text: "良" };
        if (aqi <= 150) return { icon: "😐", text: "轻度" };
        if (aqi <= 200) return { icon: "😷", text: "中度" };
        if (aqi <= 300) return { icon: "⚠️", text: "重度" };
        return { icon: "💀", text: "严重" };
    }
    
    function getWeekdayShortFromOffset(offsetDays) {
        var d = new Date();
        d.setDate(d.getDate() + offsetDays);
        var weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        return weekdays[d.getDay()];
    }
    
    function compatibleFetch(url, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    try {
                        var data = JSON.parse(xhr.responseText);
                        callback(null, data);
                    } catch(e) {
                        callback(e, null);
                    }
                } else {
                    callback(new Error('HTTP ' + xhr.status), null);
                }
            }
        };
        xhr.onerror = function() {
            callback(new Error('Network error'), null);
        };
        xhr.send();
    }
    
    function fetchShanghaiWeather() {
        // 使用丽园路坐标获取5日天气预报（确保有今日+未来三日）
        var forecastUrl = "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&daily=weather_code,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max&current_weather=true&timezone=Asia/Shanghai&forecast_days=5";
        
        compatibleFetch(forecastUrl, function(err, data) {
            if (err || !data) {
                console.warn("天气获取失败，使用本地降级数据", err);
                applyFallbackWeather();
                return;
            }
            
            var current = data.current_weather;
            if (current) {
                var temperature = current.temperature;
                var weatherCode = current.weathercode;
                weatherIconEl.innerText = wmoToEmoji(weatherCode);
                weatherTempEl.innerText = Math.round(temperature) + "°";
            } else {
                weatherIconEl.innerText = "☁️";
                weatherTempEl.innerText = "22°";
            }
            
            if (data.daily && data.daily.relative_humidity_2m_max && data.daily.relative_humidity_2m_max.length > 0) {
                var humidity = data.daily.relative_humidity_2m_max[0];
                weatherHumidityEl.innerHTML = "💦 " + humidity + "%";
            } else {
                weatherHumidityEl.innerHTML = "💦 --%";
            }
            
            // 空气质量API同样使用丽园路坐标
            var aqiUrl = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=" + LAT + "&longitude=" + LON + "&current=european_aqi&timezone=Asia/Shanghai";
            compatibleFetch(aqiUrl, function(aqiErr, aqiData) {
                if (!aqiErr && aqiData && aqiData.current && aqiData.current.european_aqi !== undefined) {
                    var aqiValue = aqiData.current.european_aqi;
                    var aqiInfo = getAqiInfo(aqiValue);
                    weatherAqiEl.innerHTML = aqiInfo.icon + " " + aqiInfo.text;
                } else {
                    weatherAqiEl.innerHTML = "😊 良";
                }
            });
            
            var daily = data.daily;
            // 显示今日 + 未来三天 (总共最多4天)
            if (daily && daily.time && daily.time.length >= 4) {
                var forecastHtml = "";
                // 今日卡片 (索引0)
                var todayMax = Math.round(daily.temperature_2m_max[0]);
                var todayMin = Math.round(daily.temperature_2m_min[0]);
                var todayCode = daily.weather_code[0];
                var todayEmoji = wmoToEmoji(todayCode);
                forecastHtml += '<div class="forecast-day-card">' +
                    '<div class="forecast-week">今日</div>' +
                    '<div class="forecast-emoji">' + todayEmoji + '</div>' +
                    '<div class="forecast-range">' + todayMin + "°/" + todayMax + "°</div>" +
                    '</div>';
                
                // 未来三天 (索引1,2,3)
                var maxDays = Math.min(3, daily.time.length - 1);
                for (var i = 1; i <= maxDays; i++) {
                    var maxTemp = Math.round(daily.temperature_2m_max[i]);
                    var minTemp = Math.round(daily.temperature_2m_min[i]);
                    var weatherCodeDay = daily.weather_code[i];
                    var emoji = wmoToEmoji(weatherCodeDay);
                    var weekName = getWeekdayShortFromOffset(i);
                    forecastHtml += '<div class="forecast-day-card">' +
                        '<div class="forecast-week">' + weekName + '</div>' +
                        '<div class="forecast-emoji">' + emoji + '</div>' +
                        '<div class="forecast-range">' + minTemp + "°/" + maxTemp + "°</div>" +
                        '</div>';
                }
                forecastGroup.innerHTML = forecastHtml;
            } else {
                // 如果数据不足4天，使用降级展示但保留今日+未来三天的格式
                applyFallbackWeather();
            }
        });
    }
    
    // 降级数据：包含今日 + 未来三天 格式完全一致
    function applyFallbackWeather() {
        var todayRef = new Date();
        var getWeek = function(offset) {
            var d = new Date(todayRef);
            d.setDate(todayRef.getDate() + offset);
            var w = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
            return w[d.getDay()];
        };
        // 模拟今日天气 (基于当前季节温和数值)
        var fallbackToday = {
            week: "今日",
            emoji: "🌤️",
            min: "19",
            max: "26"
        };
        var fallbackFuture = [
            { week: getWeek(1), emoji: "🌤️", min: "19", max: "25" },
            { week: getWeek(2), emoji: "☁️", min: "18", max: "24" },
            { week: getWeek(3), emoji: "🌦️", min: "17", max: "22" }
        ];
        var fallHtml = "";
        fallHtml += '<div class="forecast-day-card">' +
            '<div class="forecast-week">今日</div>' +
            '<div class="forecast-emoji">' + fallbackToday.emoji + '</div>' +
            '<div class="forecast-range">' + fallbackToday.min + "°/" + fallbackToday.max + "°</div>" +
            '</div>';
        for (var i = 0; i < fallbackFuture.length; i++) {
            var f = fallbackFuture[i];
            fallHtml += '<div class="forecast-day-card">' +
                '<div class="forecast-week">' + f.week + '</div>' +
                '<div class="forecast-emoji">' + f.emoji + '</div>' +
                '<div class="forecast-range">' + f.min + "°/" + f.max + "°</div>" +
                '</div>';
        }
        forecastGroup.innerHTML = fallHtml;
        weatherIconEl.innerText = "☁️";
        weatherTempEl.innerText = "22°";
        weatherHumidityEl.innerHTML = "💦 68%";
        weatherAqiEl.innerHTML = "😊 良";
    }
    
    fetchShanghaiWeather();
    setInterval(fetchShanghaiWeather, 3600000);
    window.addEventListener("online", function() { fetchShanghaiWeather(); });
    
    // 翻页辅助样式
    var styleFix = document.createElement('style');
    styleFix.textContent = '.num { backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }';
    document.head.appendChild(styleFix);
    
    window.addEventListener('load', function() {
        var nums = document.querySelectorAll('.num');
        for (var i = 0; i < nums.length; i++) {
            nums[i].style.transform = 'rotateX(0deg)';
            nums[i].style.webkitTransform = 'rotateX(0deg)';
        }
        updateClock();
        
        // 确保GIF状态在页面完全加载后与存储状态完全匹配 (再次保证防止闪烁)
        var storedHide = getGifHiddenState();
        if (storedHide) {
            if (gifContainer.style.display !== "none") {
                gifContainer.style.display = "none";
                toggleGifBtn.textContent = "显示 GIF";
            }
        } else {
            if (gifContainer.style.display === "none") {
                gifContainer.style.display = "";
                toggleGifBtn.textContent = "隐藏 GIF";
            }
        }
    });
</script>
</body></html>
