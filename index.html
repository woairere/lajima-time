<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>翻页时钟 · 上海天气</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:Helvetica,Arial,sans-serif;transition:background .3s}
.theme0{background:#FFCC99}
.theme1{background:#222}
.theme1 .digit{background:#333}
.theme1 .num{color:#eee}
.theme1 .colon{color:#eee}
.theme1 .digit::before{background:#444}
.theme2{background:#f5f5f5}
.theme2 .digit{background:#111}
.theme2 .num{color:#fff} 
.theme2 .colon{color:#111}
.theme3{background:#192841}
.theme3 .digit{background:#fff}
.theme3 .num{color:#192841}
.theme3 .colon{color:#fff}
.clock{display:flex;align-items:center;gap:16px}
.digit-group{display:flex;gap:10px}
.digit{width:130px;height:200px;background:#fff;border-radius:10px;margin:0 4px;position:relative;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:background .3s}
.digit::before{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#eee;z-index:2;transition:background .3s}
.num{width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:140px;color:#333;transition:transform .3s ease,color .3s}
.colon{font-size:150px;color:#333;margin:0 8px;display:inline-block;transition:color .3s}
.btn{position:fixed;bottom:30px;padding:10px 22px;border:none;border-radius:8px;background:#333;color:#fff;font-size:16px;cursor:pointer;z-index:10}
.btn:active{opacity:.8}

/* 天气卡片 - 与时钟风格深度融合 */
.weather-card {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 25;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(14px);
    border-radius: 32px;
    padding: 12px 20px;
    font-family: Helvetica, Arial, sans-serif;
    transition: all 0.2s ease;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    min-width: 230px;
    text-align: right;
}

.theme0 .weather-card {
    background: rgba(245, 215, 170, 0.7);
    backdrop-filter: blur(12px);
    border-color: rgba(100, 70, 30, 0.25);
    color: #4a2c10;
}
.theme1 .weather-card {
    background: rgba(35, 35, 45, 0.8);
    border-color: rgba(255,255,255,0.2);
    color: #f0f0f0;
}
.theme2 .weather-card {
    background: rgba(235, 235, 240, 0.75);
    backdrop-filter: blur(12px);
    border-color: rgba(0,0,0,0.1);
    color: #1e1e2a;
}
.theme3 .weather-card {
    background: rgba(20, 35, 55, 0.8);
    border-color: rgba(255,255,255,0.2);
    color: #eef4ff;
}

.weather-now {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}
.weather-icon-temp {
    display: flex;
    align-items: baseline;
    gap: 6px;
}
.weather-icon {
    font-size: 38px;
    line-height: 1;
}
.temp-unit {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.5px;
}
.weather-meta {
    display: flex;
    gap: 16px;
    font-size: 14px;
    background: rgba(255,255,255,0.15);
    padding: 5px 14px;
    border-radius: 40px;
    font-weight: 500;
}
.weather-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.forecast-group {
    display: flex;
    gap: 16px;
    justify-content: flex-end;
    margin-top: 8px;
}
.forecast-day-card {
    text-align: center;
    min-width: 68px;
    background: rgba(255,255,255,0.1);
    border-radius: 28px;
    padding: 6px 8px;
    backdrop-filter: blur(4px);
    transition: all 0.2s;
}
.forecast-week {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
}
.forecast-emoji {
    font-size: 24px;
    margin: 4px 0 2px;
}
.forecast-range {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.9;
}

@media (max-width: 1024px) {
    .weather-card { top: 16px; right: 16px; padding: 10px 16px; min-width: 200px; }
    .weather-icon { font-size: 32px; }
    .temp-unit { font-size: 28px; }
    .weather-meta { gap: 12px; font-size: 12px; padding: 4px 12px; }
    .forecast-group { gap: 12px; }
    .forecast-day-card { min-width: 58px; padding: 5px 6px; }
    .forecast-emoji { font-size: 20px; }
}
@media (max-width: 780px) {
    .weather-card { top: 12px; right: 12px; padding: 8px 14px; min-width: 180px; }
    .weather-icon { font-size: 28px; }
    .temp-unit { font-size: 24px; }
    .weather-meta { gap: 10px; font-size: 11px; }
    .forecast-group { gap: 8px; }
    .forecast-day-card { min-width: 52px; }
    .forecast-week { font-size: 10px; }
    .forecast-emoji { font-size: 18px; }
    .forecast-range { font-size: 10px; }
}
@media (max-width: 640px) {
    .weather-card { display: none; }
}
</style></head>
<body class="theme0">
<div class="clock">
    <div class="digit-group"><div class="digit"><div class="num" id="h1">0</div></div><div class="digit"><div class="num" id="h2">0</div></div></div>
    <span class="colon">:</span>
    <div class="digit-group"><div class="digit"><div class="num" id="m1">0</div></div><div class="digit"><div class="num" id="m2">0</div></div></div>
    <span class="colon">:</span>
    <div class="digit-group"><div class="digit"><div class="num" id="s1">0</div></div><div class="digit"><div class="num" id="s2">0</div></div></div>
</div>
<button class="btn" id="themeBtn">切换配色</button>

<div class="weather-card" id="weatherCard">
    <div class="weather-now">
        <div class="weather-icon-temp">
            <span class="weather-icon" id="weatherIcon">☀️</span>
            <span class="temp-unit" id="weatherTemp">--°</span>
        </div>
        <div class="weather-meta">
            <span id="weatherHumidity">💧 --%</span>
            <span id="weatherAqi">🌱 优</span>
        </div>
    </div>
    <div class="forecast-group" id="forecastGroup">
        <div class="forecast-day-card">加载中...</div>
    </div>
</div>

<script>
    // ========== 翻页时钟逻辑（保留完整，增加每小时时间同步校准）==========
    const themes=["theme0","theme1","theme2","theme3"];
    let cur=0;
    const btn=document.getElementById("themeBtn");
    btn.onclick=()=>{
        cur=(cur+1)%themes.length;
        document.body.className=themes[cur];
    };
    function pad(n){return n<10?"0"+n:""+n;}
    function flip(el,newVal){
        if(el.textContent===newVal) return;
        el.style.transform="rotateX(-90deg)";
        setTimeout(()=>{
            el.textContent=newVal;
            el.style.transform="rotateX(0deg)";
        },150);
    }
    
    // 时钟更新函数（基于当前系统时间）
    function updateClock() {
        const d=new Date();
        const h=pad(d.getHours()), m=pad(d.getMinutes()), s=pad(d.getSeconds());
        flip(document.getElementById("h1"),h[0]);
        flip(document.getElementById("h2"),h[1]);
        flip(document.getElementById("m1"),m[0]);
        flip(document.getElementById("m2"),m[1]);
        flip(document.getElementById("s1"),s[0]);
        flip(document.getElementById("s2"),s[1]);
    }
    
    // 启动时钟：每秒更新
    updateClock();
    const clockInterval = setInterval(updateClock, 1000);
    
    // 每小时整点同步一次时间（防止setInterval累积误差，重新校准显示）
    // 方法：每小时重新从系统获取时间强制刷新一次当前显示，消除任何潜在偏差
    setInterval(() => {
        // 强制重新读取系统时间并立即更新所有数字（无动画偏差修正）
        const now = new Date();
        const hh = pad(now.getHours());
        const mm = pad(now.getMinutes());
        const ss = pad(now.getSeconds());
        const h1El = document.getElementById("h1");
        const h2El = document.getElementById("h2");
        const m1El = document.getElementById("m1");
        const m2El = document.getElementById("m2");
        const s1El = document.getElementById("s1");
        const s2El = document.getElementById("s2");
        // 直接修正文本（不加翻转动画，保持同步干净）
        if (h1El.textContent !== hh[0]) h1El.textContent = hh[0];
        if (h2El.textContent !== hh[1]) h2El.textContent = hh[1];
        if (m1El.textContent !== mm[0]) m1El.textContent = mm[0];
        if (m2El.textContent !== mm[1]) m2El.textContent = mm[1];
        if (s1El.textContent !== ss[0]) s1El.textContent = ss[0];
        if (s2El.textContent !== ss[1]) s2El.textContent = ss[1];
        // 同时矫正transform状态，避免卡在翻转中
        const allNums = [h1El, h2El, m1El, m2El, s1El, s2El];
        allNums.forEach(el => { if (el.style.transform === "rotateX(-90deg)") el.style.transform = "rotateX(0deg)"; });
    }, 3600000); // 每小时整点校准一次
    
    // ========== 天气模块: Open-Meteo API (未来5天，包含周六) ==========
    const weatherIconEl = document.getElementById("weatherIcon");
    const weatherTempEl = document.getElementById("weatherTemp");
    const weatherHumidityEl = document.getElementById("weatherHumidity");
    const weatherAqiEl = document.getElementById("weatherAqi");
    const forecastGroup = document.getElementById("forecastGroup");
    
    // WMO 天气代码映射
    function wmoToEmoji(code) {
        const map = {
            0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 48: "🌫️",
            51: "🌦️", 53: "🌧️", 55: "🌧️", 56: "🌧️", 57: "🌧️",
            61: "🌧️", 63: "🌧️", 65: "🌧️", 66: "🌧️", 67: "🌧️",
            71: "❄️", 73: "❄️", 75: "❄️", 77: "❄️", 80: "🌦️",
            81: "🌧️", 82: "🌧️", 85: "🌨️", 86: "❄️", 95: "⛈️",
            96: "⛈️", 99: "⛈️"
        };
        return map[code] || "🌡️";
    }
    
    // 根据AQI数值返回图标和文字 (优、良、轻度污染、中度污染、重度污染)
    function getAqiInfo(aqi) {
        if (aqi <= 50) return { icon: "🌱", text: "优" };
        if (aqi <= 100) return { icon: "🌤️", text: "良" };
        if (aqi <= 150) return { icon: "⚠️", text: "轻度" };
        if (aqi <= 200) return { icon: "⚡", text: "中度" };
        if (aqi <= 300) return { icon: "🚨", text: "重度" };
        return { icon: "💀", text: "严重" };
    }
    
    function getWeekdayShortFromOffset(offsetDays) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        return weekdays[d.getDay()];
    }
    
    async function fetchShanghaiWeather() {
        try {
            // 获取未来5天天气预报 (温度+湿度+天气代码)
            const forecastUrl = "https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737&daily=weather_code,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max&current_weather=true&timezone=Asia/Shanghai&forecast_days=5";
            const response = await fetch(forecastUrl);
            if (!response.ok) throw new Error("weather api failed");
            const data = await response.json();
            
            // 当前天气
            const current = data.current_weather;
            const temperature = current.temperature;
            const weatherCode = current.weathercode;
            weatherIconEl.innerText = wmoToEmoji(weatherCode);
            weatherTempEl.innerText = `${Math.round(temperature)}°`;
            
            // 湿度
            if (data.daily && data.daily.relative_humidity_2m_max && data.daily.relative_humidity_2m_max.length > 0) {
                const humidity = data.daily.relative_humidity_2m_max[0];
                weatherHumidityEl.innerHTML = `💧 ${humidity}%`;
            } else {
                weatherHumidityEl.innerHTML = `💧 --%`;
            }
            
            // 空气质量 (独立API)
            try {
                const aqiUrl = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=31.2304&longitude=121.4737&current=european_aqi&timezone=Asia/Shanghai";
                const aqiResp = await fetch(aqiUrl);
                if (aqiResp.ok) {
                    const aqiData = await aqiResp.json();
                    if (aqiData.current && aqiData.current.european_aqi !== undefined) {
                        const aqiValue = aqiData.current.european_aqi;
                        const { icon, text } = getAqiInfo(aqiValue);
                        weatherAqiEl.innerHTML = `${icon} ${text}`;
                    } else {
                        weatherAqiEl.innerHTML = `🌤️ 良`;
                    }
                } else {
                    weatherAqiEl.innerHTML = `🌤️ 良`;
                }
            } catch (e) {
                console.warn("AQI获取失败，使用默认良");
                weatherAqiEl.innerHTML = `🌤️ 良`;
            }
            
            // 未来三天预报 (明天、后天、第三天，确保周六完整)
            const daily = data.daily;
            if (daily && daily.time && daily.time.length >= 4) {
                let forecastHtml = "";
                for (let i = 1; i <= 3; i++) {
                    if (i >= daily.time.length) break;
                    const maxTemp = Math.round(daily.temperature_2m_max[i]);
                    const minTemp = Math.round(daily.temperature_2m_min[i]);
                    const weatherCodeDay = daily.weather_code[i];
                    const emoji = wmoToEmoji(weatherCodeDay);
                    const weekName = getWeekdayShortFromOffset(i);
                    forecastHtml += `
                        <div class="forecast-day-card">
                            <div class="forecast-week">${weekName}</div>
                            <div class="forecast-emoji">${emoji}</div>
                            <div class="forecast-range">${minTemp}°/${maxTemp}°</div>
                        </div>
                    `;
                }
                forecastGroup.innerHTML = forecastHtml;
            } else {
                throw new Error("forecast data insufficient");
            }
        } catch (err) {
            console.warn("天气获取失败，使用本地降级数据(含周六)", err);
            // 优雅降级：动态生成未来三天（确保周六不缺失）
            const todayRef = new Date();
            const getWeek = (offset) => {
                const d = new Date(todayRef);
                d.setDate(todayRef.getDate() + offset);
                const w = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
                return w[d.getDay()];
            };
            const fallbackForecast = [
                { week: getWeek(1), emoji: "🌤️", min: "19", max: "25" },
                { week: getWeek(2), emoji: "☁️", min: "18", max: "24" },
                { week: getWeek(3), emoji: "🌦️", min: "17", max: "22" }
            ];
            let fallHtml = "";
            for (let f of fallbackForecast) {
                fallHtml += `<div class="forecast-day-card">
                    <div class="forecast-week">${f.week}</div>
                    <div class="forecast-emoji">${f.emoji}</div>
                    <div class="forecast-range">${f.min}°/${f.max}°</div>
                </div>`;
            }
            forecastGroup.innerHTML = fallHtml;
            weatherIconEl.innerText = "☁️";
            weatherTempEl.innerText = "22°";
            weatherHumidityEl.innerHTML = "💧 68%";
            weatherAqiEl.innerHTML = "🌤️ 良";
        }
    }
    
    // 启动天气（立刻 + 每小时刷新）
    fetchShanghaiWeather();
    setInterval(fetchShanghaiWeather, 3600000);
    window.addEventListener("online", () => { fetchShanghaiWeather(); });
</script>
</body></html>
