<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>翻页时钟 · 上海天气</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:Helvetica,Arial,sans-serif;transition:background .3s}
.theme0{background:#FFCC99}
.theme1{background:#222}
.theme1 .digit{background:#333}
.theme1 .num{color:#eee}
.theme1 .colon{color:#eee}
.theme1 .digit::before{background:#444}
.theme2{background:#f5f5f5}
.theme2 .digit{background:#111}
.theme2 .num{color:#fff} 
.theme2 .colon{color:#111}
.theme3{background:#192841}
.theme3 .digit{background:#fff}
.theme3 .num{color:#192841}
.theme3 .colon{color:#fff}
.clock{display:flex;align-items:center;gap:16px}
.digit-group{display:flex;gap:10px}
.digit{width:130px;height:200px;background:#fff;border-radius:10px;margin:0 4px;position:relative;overflow:hhidden;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:background .3s}
.digit::before{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#eee;z-index:2;transition:background .3s}
.num{width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:140px;color:#333;transition:transform .3s ease,color .3s}
.colon{font-size:150px;color:#333;margin:0 8px;display:inline-block;transition:color .3s}
.btn{position:fixed;bottom:30px;padding:10px 22px;border:none;border-radius:8px;background:#333;color:#fff;font-size:16px;cursor:pointer;z-index:10}
.btn:active{opacity:.8}

/* 天气卡片 - 与时钟风格深度融合，移除backdrop-filter兼容iOS10 */
.weather-card {
    position: fixed;
    top: 24px;
    right: 24px;
    z-index: 25;
    background: rgba(0, 0, 0, 0.65);
    border-radius: 32px;
    padding: 12px 20px;
    font-family: Helvetica, Arial, sans-serif;
    transition: all 0.2s ease;
    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    min-width: 230px;
    text-align: right;
}

.theme0 .weather-card {
    background: rgba(245, 215, 170, 0.85);
    border-color: rgba(100, 70, 30, 0.25);
    color: #4a2c10;
}
.theme1 .weather-card {
    background: rgba(35, 35, 45, 0.85);
    border-color: rgba(255,255,255,0.2);
    color: #f0f0f0;
}
.theme2 .weather-card {
    background: rgba(235, 235, 240, 0.85);
    border-color: rgba(0,0,0,0.1);
    color: #1e1e2a;
}
.theme3 .weather-card {
    background: rgba(20, 35, 55, 0.85);
    border-color: rgba(255,255,255,0.2);
    color: #eef4ff;
}

.weather-now {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    margin-bottom: 10px;
    flex-wrap: wrap;
}
.weather-icon-temp {
    display: flex;
    align-items: baseline;
    gap: 6px;
}
.weather-icon {
    font-size: 38px;
    line-height: 1;
}
.temp-unit {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.5px;
}
.weather-meta {
    display: flex;
    gap: 16px;
    font-size: 14px;
    background: rgba(255,255,255,0.2);
    padding: 5px 14px;
    border-radius: 40px;
    font-weight: 500;
}
.weather-meta span {
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.forecast-group {
    display: flex;
    gap: 16px;
    justify-content: flex-end;
    margin-top: 8px;
}
.forecast-day-card {
    text-align: center;
    min-width: 68px;
    background: rgba(255,255,255,0.12);
    border-radius: 28px;
    padding: 6px 8px;
    transition: all 0.2s;
}
.forecast-week {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
}
.forecast-emoji {
    font-size: 24px;
    margin: 4px 0 2px;
}
.forecast-range {
    font-size: 12px;
    font-weight: 500;
    opacity: 0.9;
}

/* iPad适配 */
@media (max-width: 1024px) {
    .digit{width:140px;height:150px}
    .num{font-size:140px}
    .colon{font-size:140px}
    .clock{gap:8px}
    .digit-group{gap:6px}
    .weather-card { top: 16px; right: 16px; padding: 10px 16px; min-width: 200px; }
    .weather-icon { font-size: 32px; }
    .temp-unit { font-size: 28px; }
    .weather-meta { gap: 12px; font-size: 12px; padding: 4px 12px; }
    .forecast-group { gap: 12px; }
    .forecast-day-card { min-width: 58px; padding: 5px 6px; }
    .forecast-emoji { font-size: 20px; }
}
@media (max-width: 780px) {
    .digit{width:70px;height:105px}
    .num{font-size:70px}
    .colon{font-size:80px}
    .clock{gap:5px}
    .digit-group{gap:4px}
    .weather-card { top: 12px; right: 12px; padding: 8px 14px; min-width: 180px; }
    .weather-icon { font-size: 28px; }
    .temp-unit { font-size: 24px; }
    .weather-meta { gap: 10px; font-size: 11px; }
    .forecast-group { gap: 8px; }
    .forecast-day-card { min-width: 52px; }
    .forecast-week { font-size: 10px; }
    .forecast-emoji { font-size: 18px; }
    .forecast-range { font-size: 10px; }
}
@media (max-width: 640px) {
    .weather-card { display: none; }
}
</style></head>
<body class="theme0">
<div class="clock">
    <div class="digit-group"><div class="digit"><div class="num" id="h1">0</div></div><div class="digit"><div class="num" id="h2">0</div></div></div>
    <span class="colon">:</span>
    <div class="digit-group"><div class="digit"><div class="num" id="m1">0</div></div><div class="digit"><div class="num" id="m2">0</div></div></div>
    <span class="colon">:</span>
    <div class="digit-group"><div class="digit"><div class="num" id="s1">0</div></div><div class="digit"><div class="num" id="s2">0</div></div></div>
</div>
<button class="btn" id="themeBtn">切换配色</button>

<div class="weather-card" id="weatherCard">
    <div class="weather-now">
        <div class="weather-icon-temp">
            <span class="weather-icon" id="weatherIcon">☀️</span>
            <span class="temp-unit" id="weatherTemp">--°</span>
        </div>
        <div class="weather-meta">
            <span id="weatherHumidity">💧 --%</span>
            <span id="weatherAqi">🌱 优</span>
        </div>
    </div>
    <div class="forecast-group" id="forecastGroup">
        <div class="forecast-day-card">加载中...</div>
    </div>
</div>

<script>
(function(){
    // iOS 10兼容性处理：确保requestAnimationFrame存在
    if (!window.requestAnimationFrame) {
        window.requestAnimationFrame = function(cb) { setTimeout(cb, 16); };
    }
    
    // ========== 翻页时钟逻辑 ==========
    var themes = ["theme0","theme1","theme2","theme3"];
    var cur = 0;
    var btn = document.getElementById("themeBtn");
    btn.onclick = function(){
        cur = (cur + 1) % themes.length;
        document.body.className = themes[cur];
    };
    
    function pad(n){
        return n < 10 ? "0" + n : "" + n;
    }
    
    function flip(el, newVal){
        if(el.textContent === newVal) return;
        el.style.transform = "rotateX(-90deg)";
        setTimeout(function(){
            el.textContent = newVal;
            el.style.transform = "rotateX(0deg)";
        }, 150);
    }
    
    function updateClock(){
        var d = new Date();
        var h = pad(d.getHours());
        var m = pad(d.getMinutes());
        var s = pad(d.getSeconds());
        flip(document.getElementById("h1"), h[0]);
        flip(document.getElementById("h2"), h[1]);
        flip(document.getElementById("m1"), m[0]);
        flip(document.getElementById("m2"), m[1]);
        flip(document.getElementById("s1"), s[0]);
        flip(document.getElementById("s2"), s[1]);
    }
    
    updateClock();
    setInterval(updateClock, 1000);
    
    // 每小时整点校准
    setInterval(function(){
        var now = new Date();
        var hh = pad(now.getHours());
        var mm = pad(now.getMinutes());
        var ss = pad(now.getSeconds());
        var h1El = document.getElementById("h1");
        var h2El = document.getElementById("h2");
        var m1El = document.getElementById("m1");
        var m2El = document.getElementById("m2");
        var s1El = document.getElementById("s1");
        var s2El = document.getElementById("s2");
        if(h1El.textContent !== hh[0]) h1El.textContent = hh[0];
        if(h2El.textContent !== hh[1]) h2El.textContent = hh[1];
        if(m1El.textContent !== mm[0]) m1El.textContent = mm[0];
        if(m2El.textContent !== mm[1]) m2El.textContent = mm[1];
        if(s1El.textContent !== ss[0]) s1El.textContent = ss[0];
        if(s2El.textContent !== ss[1]) s2El.textContent = ss[1];
        var allNums = [h1El, h2El, m1El, m2El, s1El, s2El];
        for(var i=0;i<allNums.length;i++){
            if(allNums[i].style.transform === "rotateX(-90deg)") 
                allNums[i].style.transform = "rotateX(0deg)";
        }
    }, 3600000);
    
    // ========== 天气模块 (不使用fetch，改用XMLHttpRequest兼容iOS10) ==========
    var weatherIconEl = document.getElementById("weatherIcon");
    var weatherTempEl = document.getElementById("weatherTemp");
    var weatherHumidityEl = document.getElementById("weatherHumidity");
    var weatherAqiEl = document.getElementById("weatherAqi");
    var forecastGroup = document.getElementById("forecastGroup");
    
    // WMO 天气代码映射
    function wmoToEmoji(code){
        var map = {
            0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️", 45: "🌫️", 48: "🌫️",
            51: "🌦️", 53: "🌧️", 55: "🌧️", 56: "🌧️", 57: "🌧️",
            61: "🌧️", 63: "🌧️", 65: "🌧️", 66: "🌧️", 67: "🌧️",
            71: "❄️", 73: "❄️", 75: "❄️", 77: "❄️", 80: "🌦️",
            81: "🌧️", 82: "🌧️", 85: "🌨️", 86: "❄️", 95: "⛈️",
            96: "⛈️", 99: "⛈️"
        };
        return map[code] || "🌡️";
    }
    
    function getAqiInfo(aqi){
        if(aqi <= 50) return { icon: "🌱", text: "优" };
        if(aqi <= 100) return { icon: "🌤️", text: "良" };
        if(aqi <= 150) return { icon: "⚠️", text: "轻度" };
        if(aqi <= 200) return { icon: "⚡", text: "中度" };
        if(aqi <= 300) return { icon: "🚨", text: "重度" };
        return { icon: "💀", text: "严重" };
    }
    
    function getWeekdayShortFromOffset(offsetDays){
        var d = new Date();
        d.setDate(d.getDate() + offsetDays);
        var weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        return weekdays[d.getDay()];
    }
    
    function getWeekdayShortFromOffsetForFallback(offsetDays){
        var d = new Date();
        d.setDate(d.getDate() + offsetDays);
        var weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
        return weekdays[d.getDay()];
    }
    
    // 使用XMLHttpRequest替代fetch
    function fetchShanghaiWeather(){
        var forecastUrl = "https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737&daily=weather_code,temperature_2m_max,temperature_2m_min,relative_humidity_2m_max&current_weather=true&timezone=Asia/Shanghai&forecast_days=5";
        
        var xhr = new XMLHttpRequest();
        xhr.open("GET", forecastUrl, true);
        xhr.timeout = 10000;
        xhr.onload = function(){
            if(xhr.status >= 200 && xhr.status < 300){
                try{
                    var data = JSON.parse(xhr.responseText);
                    
                    // 当前天气
                    if(data.current_weather){
                        var current = data.current_weather;
                        var temperature = current.temperature;
                        var weatherCode = current.weathercode;
                        weatherIconEl.innerText = wmoToEmoji(weatherCode);
                        weatherTempEl.innerText = Math.round(temperature) + "°";
                    }
                    
                    // 湿度
                    if(data.daily && data.daily.relative_humidity_2m_max && data.daily.relative_humidity_2m_max.length > 0){
                        var humidity = data.daily.relative_humidity_2m_max[0];
                        weatherHumidityEl.innerHTML = "💧 " + humidity + "%";
                    } else {
                        weatherHumidityEl.innerHTML = "💧 --%";
                    }
                    
                    // 空气质量API (独立XMLHttpRequest)
                    var aqiUrl = "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=31.2304&longitude=121.4737&current=european_aqi&timezone=Asia/Shanghai";
                    var aqiXhr = new XMLHttpRequest();
                    aqiXhr.open("GET", aqiUrl, true);
                    aqiXhr.timeout = 8000;
                    aqiXhr.onload = function(){
                        if(aqiXhr.status >= 200 && aqiXhr.status < 300){
                            try{
                                var aqiData = JSON.parse(aqiXhr.responseText);
                                if(aqiData.current && aqiData.current.european_aqi !== undefined){
                                    var aqiValue = aqiData.current.european_aqi;
                                    var aqiInfo = getAqiInfo(aqiValue);
                                    weatherAqiEl.innerHTML = aqiInfo.icon + " " + aqiInfo.text;
                                } else {
                                    weatherAqiEl.innerHTML = "🌤️ 良";
                                }
                            } catch(e){
                                weatherAqiEl.innerHTML = "🌤️ 良";
                            }
                        } else {
                            weatherAqiEl.innerHTML = "🌤️ 良";
                        }
                    };
                    aqiXhr.onerror = function(){
                        weatherAqiEl.innerHTML = "🌤️ 良";
                    };
                    aqiXhr.send();
                    
                    // 未来三天预报
                    var daily = data.daily;
                    if(daily && daily.time && daily.time.length >= 4){
                        var forecastHtml = "";
                        for(var i = 1; i <= 3; i++){
                            if(i >= daily.time.length) break;
                            var maxTemp = Math.round(daily.temperature_2m_max[i]);
                            var minTemp = Math.round(daily.temperature_2m_min[i]);
                            var weatherCodeDay = daily.weather_code[i];
                            var emoji = wmoToEmoji(weatherCodeDay);
                            var weekName = getWeekdayShortFromOffset(i);
                            forecastHtml += '<div class="forecast-day-card">' +
                                '<div class="forecast-week">' + weekName + '</div>' +
                                '<div class="forecast-emoji">' + emoji + '</div>' +
                                '<div class="forecast-range">' + minTemp + "°/" + maxTemp + "°</div>" +
                                '</div>';
                        }
                        forecastGroup.innerHTML = forecastHtml;
                    } else {
                        useFallbackWeather();
                    }
                } catch(e){
                    useFallbackWeather();
                }
            } else {
                useFallbackWeather();
            }
        };
        xhr.onerror = function(){
            useFallbackWeather();
        };
        xhr.ontimeout = function(){
            useFallbackWeather();
        };
        xhr.send();
    }
    
    function useFallbackWeather(){
        var todayRef = new Date();
        function getWeek(offset){
            var d = new Date(todayRef);
            d.setDate(todayRef.getDate() + offset);
            var w = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
            return w[d.getDay()];
        }
        var fallbackForecast = [
            { week: getWeek(1), emoji: "🌤️", min: "19", max: "25" },
            { week: getWeek(2), emoji: "☁️", min: "18", max: "24" },
            { week: getWeek(3), emoji: "🌦️", min: "17", max: "22" }
        ];
        var fallHtml = "";
        for(var f=0; f<fallbackForecast.length; f++){
            fallHtml += '<div class="forecast-day-card">' +
                '<div class="forecast-week">' + fallbackForecast[f].week + '</div>' +
                '<div class="forecast-emoji">' + fallbackForecast[f].emoji + '</div>' +
                '<div class="forecast-range">' + fallbackForecast[f].min + "°/" + fallbackForecast[f].max + "°</div>" +
                '</div>';
        }
        forecastGroup.innerHTML = fallHtml;
        weatherIconEl.innerText = "☁️";
        weatherTempEl.innerText = "22°";
        weatherHumidityEl.innerHTML = "💧 68%";
        weatherAqiEl.innerHTML = "🌤️ 良";
    }
    
    // 启动天气
    fetchShanghaiWeather();
    setInterval(fetchShanghaiWeather, 3600000);
    
    // 检测网络变化 (iOS10 不支持 online/offline? 部分支持，安全添加)
    window.addEventListener("online", function(){ fetchShanghaiWeather(); });
})();
</script>
</body></html>
