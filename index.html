<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"><title>翻页时钟</title><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:Helvetica,Arial,sans-serif;transition:background .3s}.theme0{background:#FFCC99}.theme1{background:#222}.theme1 .digit{background:#333}.theme1 .num{color:#eee}.theme1 .colon{color:#eee}.theme1 .digit::before{background:#444}.theme2{background:#f5f5f5}.theme2 .digit{background:#111}.theme2 .num{color:#fff}.theme2 .colon{color:#111}.theme3{background:#192841}.theme3 .digit{background:#fff}.theme3 .num{color:#192841}.theme3 .colon{color:#fff}.clock{display:flex;align-items:center;gap:16px}.digit-group{display:flex;gap:10px}.digit{width:130px;height:200px;background:#fff;border-radius:10px;margin:0 4px;position:relative;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,0.2);transition:background .3s}.digit::before{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:#eee;z-index:2;transition:background .3s}.num{width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:140px;color:#333;transition:transform .3s ease,color .3s}.colon{font-size:150px;color:#333;margin:0 8px;display:inline-block;transition:color .3s}.btn{position:fixed;bottom:30px;padding:10px 22px;border:none;border-radius:8px;background:#333;color:#fff;font-size:16px;cursor:pointer}.btn:active{opacity:.8}</style></head><body class="theme0"><div class="clock"><div class="digit-group"><div class="digit"><div class="num" id="h1">0</div></div><div class="digit"><div class="num" id="h2">0</div></div></div><span class="colon">:</span><div class="digit-group"><div class="digit"><div class="num" id="m1">0</div></div><div class="digit"><div class="num" id="m2">0</div></div></div><span class="colon">:</span><div class="digit-group"><div class="digit"><div class="num" id="s1">0</div></div><div class="digit"><div class="num" id="s2">0</div></div></div></div><button class="btn" id="themeBtn">切换配色</button><script>const themes=["theme0","theme1","theme2","theme3"];let cur=0;const btn=document.getElementById("themeBtn");btn.onclick=()=>{cur=(cur+1)%themes.length;document.body.className=themes[cur]};function pad(n){return n<10?"0"+n:""+n}function flip(el,newVal){if(el.textContent===newVal)return;el.style.transform="rotateX(-90deg)";setTimeout(()=>{el.textContent=newVal;el.style.transform="rotateX(0deg)"},150)}function update(){const d=new Date();const h=pad(d.getHours()),m=pad(d.getMinutes()),s=pad(d.getSeconds());flip(document.getElementById("h1"),h[0]);flip(document.getElementById("h2"),h[1]);flip(document.getElementById("m1"),m[0]);flip(document.getElementById("m2"),m[1]);flip(document.getElementById("s1"),s[0]);flip(document.getElementById("s2"),s[1])}update();setInterval(update,1000);</script></body></html>
